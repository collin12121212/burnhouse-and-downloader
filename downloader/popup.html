<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Video Downloader</title>
  <style>
    /* Same palette and pieces as Burnhouse (dvdburner): warm charcoal, paper, amber.
       Hairline borders, depth from stepped backgrounds, no gradients, 30px+ targets. */
    :root {
      --ink: #1b1a18;
      --ink-raised: #232120;
      --ink-panel: #2a2725;
      --ink-sunken: #171614;
      --ink-line: #3a3632;
      --ink-line-soft: #302d2a;

      --paper: #f3ede2;
      --paper-dim: #cfc7ba;
      --muted: #8d8579;
      --muted-dim: #6d675e;

      --amber: #d9a353;
      --amber-bright: #eab96f;
      --amber-dim: #8a6a35;

      --danger: #c4685c;
      --danger-dim: #7d3f37;
      --good: #7fa46a;

      --radius: 6px;
      --radius-lg: 10px;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 430px;
      max-height: 580px;
      display: flex;
      flex-direction: column;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    /* ------------------------------------------------------------ header --- */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 14px 0 16px;
      background: var(--ink-sunken);
      border-bottom: 1px solid var(--ink-line);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--paper);
      white-space: nowrap;
    }

    .brand-tag {
      font-size: 11.5px;
      color: var(--muted-dim);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ----------------------------------------------------------- buttons --- */
    button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 30px;
      padding: 0 12px;
      border-radius: var(--radius);
      border: 1px solid var(--ink-line);
      background: var(--ink-panel);
      color: var(--paper);
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background 90ms linear, border-color 90ms linear;
    }

    button:hover:not(:disabled) {
      background: #322e2b;
      border-color: #48423c;
    }

    button:active:not(:disabled) {
      background: #2a2624;
    }

    button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    /* Primary action: the amber button. */
    .dl,
    #downloadAll {
      background: var(--amber);
      border-color: var(--amber);
      color: #241d10;
      font-weight: 600;
    }

    .dl:hover:not(:disabled),
    #downloadAll:hover:not(:disabled) {
      background: var(--amber-bright);
      border-color: var(--amber-bright);
    }

    .dl:active:not(:disabled),
    #downloadAll:active:not(:disabled) {
      background: #c9954a;
    }

    .dl:disabled {
      opacity: 1;
      background: var(--ink-panel);
      border-color: var(--amber-dim);
      color: var(--amber);
    }

    /* Quiet buttons: header tools and "Copy". */
    header button,
    .btn-secondary {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }

    header button:hover:not(:disabled),
    .btn-secondary:hover:not(:disabled) {
      background: var(--ink-panel);
      border-color: transparent;
      color: var(--paper);
    }

    /* ------------------------------------------------------------ status --- */
    #status {
      display: flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 16px;
      background: var(--ink-raised);
      border-bottom: 1px solid var(--ink-line-soft);
      color: var(--muted);
      font-size: 12px;
    }

    #status.ok { color: var(--paper-dim); }
    #status.err { color: var(--danger); }

    .rail-title {
      padding: 12px 16px 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--muted-dim);
    }

    /* -------------------------------------------------------------- list --- */
    #list {
      flex: 1;
      max-height: 400px;
      overflow-y: auto;
      padding: 0 10px 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      margin-top: 6px;
      background: var(--ink-raised);
      border: 1px solid var(--ink-line);
      border-radius: var(--radius-lg);
      transition: border-color 90ms linear;
    }

    .item:hover {
      border-color: #48423c;
    }

    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .info .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--paper);
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    .info .url {
      font-size: 11.5px;
      color: var(--muted-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* Type chips: small, uppercase, hairline. */
    .badge {
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--ink-line);
      background: var(--ink-sunken);
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .badge.hls,
    .badge.dash {
      color: var(--amber);
      border-color: var(--amber-dim);
    }

    .badge.mp4,
    .badge.webm,
    .badge.media,
    .badge.http {
      color: var(--good);
      border-color: #4a5f3e;
    }

    .badge.blob {
      color: var(--paper-dim);
    }

    .empty {
      margin-top: 6px;
      padding: 26px 18px;
      text-align: center;
      color: var(--muted-dim);
      font-size: 12.5px;
      line-height: 1.6;
      background: var(--ink-raised);
      border: 1px dashed var(--ink-line);
      border-radius: var(--radius-lg);
    }

    .empty b {
      color: var(--paper-dim);
      font-weight: 600;
    }

    /* ------------------------------------------------------------ footer --- */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px 10px 16px;
      background: var(--ink-sunken);
      border-top: 1px solid var(--ink-line);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    footer label {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 22px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    footer label:hover {
      color: var(--paper-dim);
    }

    footer input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--amber);
      cursor: pointer;
    }

    header button {
      padding: 0 8px;
    }

    #best {
      color: var(--amber);
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #38332e;
      border-radius: 5px;
      border: 2px solid var(--ink);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #48413a;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-name">Video Downloader</span>
      <span class="brand-tag">Saves videos from this page</span>
    </div>
    <button id="best" title="Try this episode on several servers at once and download the best quality, fastest one">Best quality</button>
    <button id="automate" title="Scan a whole range of episodes automatically">Automate</button>
    <button id="refresh" title="Scan the page again">Rescan</button>
    <button id="debugLog" title="Copy the extension's network/detection log">Log</button>
  </header>
  <div id="status">Scanning page…</div>
  <div class="rail-title">On this page</div>
  <div id="list"></div>
  <footer>
    <div class="options">
      <label title="If nothing is found, start the page's player muted and pause it again as soon as its video is found"><input type="checkbox" id="autoActivate" checked /> Start players silently to find videos</label>
    </div>
    <button id="downloadAll">Download all</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
